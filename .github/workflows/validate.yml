name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/skills-mcp/package-lock.json

      - name: Validate repository contracts and policy
        run: |
          python tooling/validate_repository.py
          python tooling/build_skill_index.py --check

      - name: Run validator tests
        run: python -m unittest discover -s tooling/tests -p "test_*.py" -v

      - name: Validate MCP Worker
        working-directory: services/skills-mcp
        run: |
          npm ci
          npm run check
